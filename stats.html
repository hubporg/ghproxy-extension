<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            max-width: 640px;
            width: 100%;
        }

        .header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid #eaeaea;
            text-align: center;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .title .normal {
            color: #24292e;
        }

        .title .highlight {
            color: #155DFC;
        }

        .subtitle {
            font-size: 13px;
            color: #666;
        }

        .subtitle .highlight {
            color: #155DFC;
        }

        .content {
            padding: 24px;
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #24292e;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #155DFC;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 13px;
        }

        .data-table th,
        .data-table td {
            padding: 10px 12px;
            border: 1px solid #eaeaea;
            text-align: left;
        }

        .data-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .data-table td {
            color: #555;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }

        .stat-card {
            background: #f8f9fa;
            border: 1px solid #eaeaea;
            border-radius: 10px;
            padding: 18px;
            text-align: center;
            transition: border-color 0.2s;
        }

        .stat-card:hover {
            border-color: #155DFC;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #155DFC;
            margin-bottom: 4px;
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
        }

        .notice-card {
            background: #f8f9fa;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 14px;
            margin: 16px 0;
        }

        .notice-card.warning {
            background: #fff8e1;
            border-left: 4px solid #ffc107;
        }

        .notice-card.info {
            background: #e8f5e9;
            border-left: 4px solid #2e7d32;
        }

        .notice-card.error {
            background: #ffebee;
            border-left: 4px solid #c62828;
        }

        .notice-card p {
            font-size: 13px;
            color: #555;
            line-height: 1.6;
            margin: 0;
        }

        .notice-card strong {
            color: #333;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 13px;
        }

        .info-row:not(:last-child) {
            border-bottom: 1px solid #eee;
        }

        .info-label {
            color: #666;
        }

        .info-value {
            color: #333;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .footer {
            padding: 24px;
            border-top: 1px solid #eaeaea;
            text-align: center;
        }

        .footer p {
            font-size: 12px;
            color: #999;
        }

        .footer a {
            color: #155DFC;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .btn {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 24px;
            background: #155DFC;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #0d4bb5;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #666;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .loading {
            text-align: center;
            padding: 40px 0;
            color: #999;
            font-size: 14px;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #eaeaea;
            border-top: 2px solid #155DFC;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="title">
                <span class="normal">统计</span> <span class="highlight">概览</span>
            </div>
            <div class="subtitle">GitHub <span class="highlight">Accelerator</span> 使用数据统计</div>
        </div>

        <div class="content" id="content">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div>加载中...</div>
            </div>
        </div>

        <div class="footer">
            <p><a href="https://github.com/hubporg/ghproxy-extension" target="_blank">GitHub 仓库</a> ·
                <a href="#" id="privacy-link">隐私政策</a>
            </p>
        </div>
    </div>

    <script src="browser-polyfill.js"></script>
    <script src="stats-page.js"></script>
</body>

</html>
